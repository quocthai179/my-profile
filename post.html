<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài viết - Thái's Blog</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="blog.css">
    <meta name="description" content="Blog cá nhân của Huỳnh Quốc Thái: chia sẻ kiến thức, kinh nghiệm và trải nghiệm.">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Space Background -->
    <div class="space-bg">
        <!-- Stars -->
        <div class="stars stars-layer-1"></div>
        <div class="stars stars-layer-2"></div>
        <div class="stars stars-layer-3"></div>

        <!-- Nebula Effects -->
        <div class="nebula nebula-1"></div>
        <div class="nebula nebula-2"></div>
        <div class="nebula nebula-3"></div>

        <!-- Planets -->
        <div class="planets">
            <div class="planet planet-1"></div>
            <div class="planet planet-2"></div>
            <div class="planet planet-3"></div>
            <div class="planet moon"></div>
        </div>

        <!-- Shooting Stars -->
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
    </div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">Thái's Blog</a>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link active">Bài viết</a></li>
                <li><a href="about.html" class="nav-link">Về tôi</a></li>
            </ul>
            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <main class="blog-main">
        <div class="container article-container">
            <article id="article"></article>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-info">
                    <h3>Liên hệ với tôi</h3>
                    <p><i class="fas fa-envelope"></i> hqthaia3@gmail.com</p>
                </div>
                <div class="footer-social">
                    <a href="https://github.com/quocthai179" target="_blank" class="social-link"><i class="fab fa-github"></i></a>
                    <a href="#" class="social-link"><i class="fab fa-linkedin"></i></a>
                    <a href="#" class="social-link"><i class="fab fa-facebook"></i></a>
                    <a href="#" class="social-link"><i class="fab fa-instagram"></i></a>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2025 Huỳnh Quốc Thái. Made with <i class="fas fa-heart"></i></p>
            </div>
        </div>
    </footer>

    <script src="space.js"></script>
    <script src="cosmos.js"></script>
    <script src="posts.js"></script>
    <script src="blog.js"></script>
</body>
</html>
